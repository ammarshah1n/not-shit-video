<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Synthetic relationship graph: deterministic film scene</title>
<style>
  html, body { margin: 0; padding: 0; background: #04060e; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script>
// Film scene: cinematic fly-through of the Jordan Vale people+entities graph.
// Self-contained (no deps), deterministic layout (seeded PRNG), realtime 60fps.
// Capture with tools/capture.mjs; __renderAt(seconds) owns film time.
const W = 3840, H = 2160, DURATION = 13.5; // seconds
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- seeded PRNG (deterministic layout) ----------
let _s = 42;
const rnd = () => (_s = (_s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

// ---------- palette (matches console graph legend feel) ----------
const COL = {
  person:  '#6EAFFF', // one accent family throughout
  company: '#6EAFFF',
  decision:'#6EAFFF',
  project: '#6EAFFF',
  session: '#6EAFFF',
};

// ---------- clusters: relationship groups around Jordan ----------
const CLUSTERS = [
  {name: 'leadership', cx: 0,     cy: 0,    cz: 0,    r: 330, n: 40, type: 'person'},
  {name: 'board',      cx: 1220,  cy: -560, cz: -500, r: 280, n: 28, type: 'person'},
  {name: 'customers',  cx: -1280, cy: 400,  cz: -700, r: 300, n: 34, type: 'company'},
  {name: 'ops',        cx: 470,   cy: 860,  cz: -1100,r: 290, n: 30, type: 'person'},
  {name: 'projects',   cx: -700,  cy: -760, cz: -900, r: 260, n: 24, type: 'project'},
  {name: 'sessions',   cx: 950,   cy: 520,  cz: -1850,r: 330, n: 36, type: 'session'},
  {name: 'partners',   cx: -1500, cy: -350, cz: -1950,r: 300, n: 26, type: 'company'},
];

// hero nodes the camera flies past (label · sublabel, world position)
// staggered in depth + screen position so labels never collide as the camera passes
const HEROES = [
  {label: 'Series B',      sub: 'AU$85M raise',          x: 1150, y: -500, z: -430, c: COL.decision},
  {label: 'Michael Chen',  sub: '23% of revenue',        x: -1180,y: 340,  z: -640, c: COL.person},
  {label: 'Northwind',     sub: '1,100 vehicles',        x: -620, y: -700, z: -900, c: COL.company},
  {label: 'Priya Sharma',  sub: 'VP Operations',         x: 430,  y: 800,  z: -1120,c: COL.person},
  {label: 'Apex Freight',  sub: 'contract renewal',      x: -1420,y: 560,  z: -1400,c: COL.company},
  {label: 'Sydney depot',  sub: 'delay dispute',         x: -340, y: 280,  z: -1680,c: COL.decision},
  {label: 'Sarah Okafor',  sub: 'CFO · board narrative', x: 90,   y: -90,  z: -120, c: COL.person},
];

// ---------- build node field ----------
const nodes = [];
for (const cl of CLUSTERS) {
  for (let i = 0; i < cl.n; i++) {
    // gaussian-ish ball around cluster center
    const th = rnd() * Math.PI * 2, ph = Math.acos(2 * rnd() - 1), rr = cl.r * Math.cbrt(rnd());
    const mixed = rnd(); // sprinkle secondary types into each cluster
    const type = mixed < 0.72 ? cl.type : (mixed < 0.86 ? 'decision' : 'project');
    nodes.push({
      x: cl.cx + rr * Math.sin(ph) * Math.cos(th),
      y: cl.cy + rr * Math.sin(ph) * Math.sin(th),
      z: cl.cz + rr * Math.cos(ph),
      s: 5 + rnd() * 11, c: COL[type], tw: rnd() * Math.PI * 2,
    });
  }
}
// faint far-field dust for depth
for (let i = 0; i < 320; i++) {
  nodes.push({x: (rnd() - 0.5) * 5200, y: (rnd() - 0.5) * 3200, z: -300 - rnd() * 2600,
              s: 2 + rnd() * 4, c: '#9fb3d4', tw: rnd() * Math.PI * 2, dust: true});
}
for (const hz of HEROES) nodes.push({x: hz.x, y: hz.y, z: hz.z, s: 20, c: hz.c, tw: 0, hero: hz});

// ---------- edges: intra-cluster + a few cross-cluster spines ----------
const edges = [];
const clNodes = (name) => {
  let off = 0;
  for (const cl of CLUSTERS) { if (cl.name === name) return nodes.slice(off, off + cl.n); off += cl.n; }
};
let off = 0;
for (const cl of CLUSTERS) {
  const grp = nodes.slice(off, off + cl.n);
  for (let i = 0; i < cl.n; i++) for (let k = 0; k < 3; k++) {
    const j = Math.floor(rnd() * cl.n); if (j !== i) edges.push([grp[i], grp[j]]);
  }
  off += cl.n;
}
const lead = clNodes('leadership');
for (const other of ['board', 'customers', 'ops', 'projects', 'sessions', 'partners'])
  for (let k = 0; k < 4; k++) edges.push([lead[Math.floor(rnd() * lead.length)],
    clNodes(other)[Math.floor(rnd() * clNodes(other).length)]]);
for (const n of nodes) if (n.hero) for (let k = 0; k < 5; k++)
  edges.push([n, lead[Math.floor(rnd() * lead.length)]]);

// ---------- camera path: wide hold -> slow orbit -> accelerating push-through ----------
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, p) => a + (b - a) * p;
function camera(t) { // t in 0..1; camera always aims at a look-at target
  const holdEnd = 0.30;
  let px, py, pz, tx, ty, tz;
  if (t < holdEnd) { // wide establish + gentle orbit around the field
    const p = t / holdEnd, ang = -0.14 + p * 0.20;
    px = Math.sin(ang) * 1750; py = -140 + p * 60; pz = Math.cos(ang) * 1750 + 250;
    tx = 0; ty = 60; tz = -650;
  } else { // accelerating dolly through leadership toward the deep clusters
    const p = ease((t - holdEnd) / (1 - holdEnd));
    px = lerp(Math.sin(0.06) * 1750, -460, p); py = lerp(-80, 30, p); pz = lerp(2000, -1250, p);
    tx = lerp(0, -700, p); ty = lerp(60, 120, p); tz = lerp(-650, -2700, p);
  }
  return {x: px, y: py, z: pz, yaw: Math.atan2(px - tx, pz - tz), fov: 1050};
}

function project(n, cam) {
  const dx = n.x - cam.x, dy = n.y - cam.y, dz0 = n.z - cam.z;
  // yaw rotate
  const dxr = dx * Math.cos(cam.yaw) - dz0 * Math.sin(cam.yaw);
  const dz = dx * Math.sin(cam.yaw) + dz0 * Math.cos(cam.yaw);
  if (dz > -60) return null; // behind/too close
  const k = cam.fov / -dz;
  return {sx: W / 2 + dxr * k, sy: H / 2 + dy * k, k, dz: -dz};
}

let t0 = null, running = false;
function frame(now) {
  if (t0 === null) t0 = now;
  const t = Math.min((now - t0) / 1000 / DURATION, 1);
  const cam = camera(t);
  const time = (now - t0) / 1000;

  ctx.fillStyle = '#04060e'; ctx.fillRect(0, 0, W, H);
  // vignette + core glow
  let g = ctx.createRadialGradient(W/2, H/2, 200, W/2, H/2, 1900);
  g.addColorStop(0, 'rgba(24,34,64,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // edges
  ctx.lineWidth = 1.6;
  for (const [a, b] of edges) {
    const pa = project(a, cam), pb = project(b, cam);
    if (!pa || !pb) continue;
    const al = Math.min(0.16, 90 / Math.min(pa.dz, pb.dz));
    if (al < 0.015) continue;
    ctx.strokeStyle = `rgba(140,165,210,${al})`;
    ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
  }

  // nodes (painter's order: far to near)
  const drawn = [];
  for (const n of nodes) { const p = project(n, cam); if (p) drawn.push([n, p]); }
  drawn.sort((a, b) => b[1].dz - a[1].dz);
  ctx.globalCompositeOperation = 'lighter';
  for (const [n, p] of drawn) {
    const tw = n.dust ? 0.55 : 0.75 + 0.25 * Math.sin(time * 2.1 + n.tw);
    const fade = Math.min(1, 2400 / p.dz) * tw;
    // sharp core + bounded halo — never a formless blob at close range
    const rc = Math.min(26, Math.max(1.4, n.s * p.k * 1.5));
    const rh = Math.min(95, rc * 3.2);
    const gg = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, rh);
    gg.addColorStop(0, hexA(n.c, 0.5 * fade));
    gg.addColorStop(0.35, hexA(n.c, 0.16 * fade));
    gg.addColorStop(1, hexA(n.c, 0));
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(p.sx, p.sy, rh, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA(n.c, 0.95 * fade);
    ctx.beginPath(); ctx.arc(p.sx, p.sy, rc, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // hero labels: fade in by camera distance window, scale past
  for (const [n, p] of drawn) {
    if (!n.hero) continue;
    const a = Math.max(0, Math.min(1, (1650 - p.dz) / 480)) * Math.max(0, Math.min(1, (p.dz - 150) / 230));
    if (a <= 0.01) continue;
    const fs = Math.min(200, 34000 / p.dz * 4.4);
    ctx.textAlign = 'left';
    ctx.font = `500 ${fs}px "Helvetica Neue", Arial, sans-serif`;
    ctx.fillStyle = `rgba(255,255,255,${0.94 * a})`;
    ctx.fillText(n.hero.label, p.sx + fs * 0.5, p.sy - fs * 0.25);
    ctx.font = `400 ${fs * 0.52}px "Helvetica Neue", Arial, sans-serif`;
    ctx.fillStyle = hexA(n.hero.c, 0.9 * a);
    ctx.fillText(n.hero.sub, p.sx + fs * 0.5, p.sy + fs * 0.42);
    ctx.strokeStyle = `rgba(255,255,255,${0.4 * a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.sx, p.sy, Math.max(6, n.s * p.k * 3.4), 0, Math.PI * 2); ctx.stroke();
  }

  if (running && t < 1) requestAnimationFrame(frame);
}

function hexA(hex, a) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${Math.max(0, Math.min(1, a))})`;
}

// idle first frame so the page isn't black before capture starts
frame(performance.now()); t0 = null;
window.__ready = true;
window.__startGraph = () => { running = true; t0 = null; requestAnimationFrame(frame); };
// deterministic single-frame hook for deterministic frame stepping
window.__renderAt = (t) => { t0 = 0; running = false; frame(t * 1000); t0 = null; };
</script>
</body>
</html>
